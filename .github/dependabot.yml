version: 2
updates:
- package-ecosystem: cargo
  directories:
  - /
  - /bin
  - /lib
  - /rootshell
  - /serial
  - /telcom-parser
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
- package-ecosystem: github-actions
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
- package-ecosystem: pip
  directory: /tools
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
multi-ecosystem-groups:
  weekly-patches:
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
